<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    *{
        box-sizing: border-box;
    }
    body{
       text-align: center; 
       color: white;
    }
    div#contenido{
        display: flex;
        flex-flow: column;
        background-color: rgb(107, 173, 230);
    }
    div#contenido > main{
        display: flex;
        flex-flow: column;
        background-color: rgb(255, 190, 49);
    }
    div#contenido > main > article {
        background-color: purple;
        height: 30vh;
    }
    div#contenido > main > aside{
        background-color: lightblue;
    }
    div#contenido > footer{
        background-color: rgb(110, 158, 247);
    }
    div#contenido > main > nav{
        order: -1;
    }

    @media all and (min-width:768px){
        div#contenido > main{
            flex-flow: row;
        }
        div#contenido > main > article {
        flex-grow: 2;
        }
        div#contenido > main > nav,
        div#contenido > main > aside{
            flex-grow: 1;
        }
    }
    </style>

</head>

<body>
    <div id="contenido">
        <header>CABECERA</header>
        <main>
            <article>ARTÍCULO</article>
            <nav>MENÚ</nav>
            <aside>BARRA</aside>
        </main>
        <footer>PIE DE PÁGINA</footer>
    </div>

</body>
</html>
