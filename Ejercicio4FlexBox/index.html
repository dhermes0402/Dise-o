<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 Flexbox</title>
    <style>
        body {
            padding: 2em;
        }

        .contenedor {
            display: flex;
            flex-wrap: wrap;
            font-weight: bold;
            text-align: center;
        }

    
        .header,
        .main,
        .aside1,
        .aside2,
        .footer {
            padding: 10px;
            flex: 1 100%;
        }

        .header {
            background-color: tomato;
        }

        .main {
            background-color: deepskyblue;
            text-align: left;
        }

        .aside1 {
            background-color: gold;
        }

        .aside2 {
            background-color: hotpink;
        }

        .footer {
            background-color: lightgreen;
        }

        @media (min-width: 600px) {
            .aside1,
            .aside2 {
                flex: 1 auto;
            }
        }

        @media (min-width: 800px) {
            .main {
                flex: 3 0px;
                order: 2;
            }

            .aside1 {
                order: 1;
            }

            .aside2 {
                order: 3;
            }

            .footer {
                order: 4;
            }
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <header class="header">Header</header>

        <article class="main">
            <p>Soy diego voy al parque y juego con mis amigos desde que tengo 15 años, a veces juego con mi hermano.</p>
        </article>

        <aside class="aside1">Aside 1</aside>
        <aside class="aside2">Aside 2</aside>

        <footer class="footer">Footer</footer>
    </div>
</body>

</html>
